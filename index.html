<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Cat 2026: Admin Edition</title>
    <style>
        :root { --orange: #ff9f43; --blue: #54a0ff; --purple: #a55eea; --dark: #0d0d0f; --red: #ff4757; }
        body { background: var(--dark); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        #lang-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .lang-btn { width: 200px; padding: 20px; margin: 10px; border-radius: 15px; background: var(--blue); color: white; border: none; font-size: 20px; }
        .stats { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid #222; margin-bottom: 10px; }
        #energy { font-size: 45px; color: var(--orange); font-weight: bold; }
        #cat { font-size: 110px; cursor: pointer; transition: 0.1s; display: inline-block; margin: 15px 0; }
        #cat:active { transform: scale(0.85); }
        .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 400px; margin: auto; }
        .item { background: #1e1e24; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .btn-buy { background: var(--blue); color: white; width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold; margin-top: 5px; }
        #boss-ui { display: none; padding: 15px; border-radius: 15px; margin: 10px auto; max-width: 350px; }
        .boss-hp-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 8px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: var(--red); transition: 0.2s; }
        .shadow-boss { background: #000; border: 2px solid #555; }
        .normal-boss { background: #4b1a1a; border: 1px solid var(--red); }
        .promo-item { background: linear-gradient(45deg, #2c3e50, #000); border: 1px solid var(--purple) !important; }
    </style>
</head>
<body>

    <div id="lang-screen">
        <h2>Выберите язык / Select Language</h2>
        <button class="lang-btn" onclick="setLang('ru')">Русский 🇷🇺</button>
        <button class="lang-btn" onclick="setLang('en')">English 🇺🇸</button>
    </div>

    <div class="stats">
        <div id="energy">0</div>
        <div><span id="t-gems">Гемы</span>: <span id="gems" style="color:var(--purple)">0</span> 💎</div>
        <div style="font-size: 13px;">x<span id="event-mult">1</span> Event</div>
    </div>

    <button id="newbie-gift" style="background:#2ecc71; color:white; padding:10px; border-radius:10px; border:none; margin-bottom:10px;" onclick="getGift()">🎁 +1000 EN</button>

    <div id="boss-ui">
        <div id="boss-icon" style="font-size: 40px;">👹</div>
        <b id="boss-name">БОСС</b>
        <div class="boss-hp-bar"><div id="hp-fill"></div></div>
    </div>

    <div id="cat">🐱</div>

    <div class="shop">
        <div class="item">Power +1<button class="btn-buy" onclick="buy('p')">Cost: <span id="p-c">15</span></button></div>
        <!-- Сюда админка будет добавлять акции -->
        <div id="promo-container" class="item promo-item" style="display:none">
            <span id="promo-name">Акция!</span>
            <button class="btn-buy" id="promo-btn" onclick="buyPromo()" style="background:var(--purple)">Купить</button>
        </div>
    </div>

    <input type="text" id="code-inp" placeholder="Введите код / Enter code" style="width:80%; padding:12px; margin-top:20px; background:#1a1a1a; border:1px solid #333; color:#0f0; border-radius:8px;">
    <button onclick="checkCode()" style="width:84%; margin-top:10px; background:#333; color:white; padding:10px; border-radius:8px; border:none;">ОК</button>

<script>
    let g = { m: 0, p: 1, pc: 15, gems: 0, mult: 1, giftUsed: false, lang: null };
    let boss = { active: false, hp: 0, maxHp: 0, type: 'normal' };
    let activePromo = null;

    if(localStorage.getItem('catEnergy_v5')) {
        g = JSON.parse(localStorage.getItem('catEnergy_v5'));
        if(g.lang) document.getElementById('lang-screen').style.display = 'none';
    }

    function setLang(l) { g.lang = l; document.getElementById('lang-screen').style.display = 'none'; ui(); }

    function ui() {
        if(!g.lang) return;
        document.getElementById('energy').innerText = Math.floor(g.m).toLocaleString();
        document.getElementById('gems').innerText = g.gems;
        document.getElementById('p-c').innerText = g.pc;
        document.getElementById('event-mult').innerText = g.mult;
        document.getElementById('newbie-gift').style.display = g.giftUsed ? 'none' : 'inline-block';
        localStorage.setItem('catEnergy_v5', JSON.stringify(g));
    }

    document.getElementById('cat').onclick = () => {
        if(boss.active) {
            boss.hp -= g.p;
            updateBoss();
            if(boss.hp <= 0) { boss.active = false; document.getElementById('boss-ui').style.display = 'none'; let r = (boss.type==='shadow'?25:5); g.gems += r; alert("+"+r+" 💎"); ui(); }
        } else {
            g.m += (g.p * g.mult);
            let r = Math.random();
            if(r < 0.03) startBoss('shadow'); else if(r < 0.1) startBoss('normal');
        }
        ui();
    };

    function startBoss(t) {
        boss.active = true; boss.type = t;
        const uiDiv = document.getElementById('boss-ui');
        uiDiv.style.display = 'block';
        if(t === 'shadow') { boss.maxHp = g.p * 50; uiDiv.className = 'shadow-boss'; document.getElementById('boss-icon').innerText = "🌑"; }
        else { boss.maxHp = g.p * 15; uiDiv.className = 'normal-boss'; document.getElementById('boss-icon').innerText = "🐶"; }
        boss.hp = boss.maxHp; updateBoss();
    }

    function updateBoss() { document.getElementById('hp-fill').style.width = (boss.hp/boss.maxHp)*100 + '%'; }

    function buy(type) { if(g.m >= g.pc) { g.m -= g.pc; g.p++; g.pc = Math.round(g.pc*1.6); ui(); } }

    function getGift() { if(!g.giftUsed) { g.m += 1000; g.giftUsed = true; ui(); } }

    // ОБРАБОТКА КОДОВ
    function checkCode() {
        let val = document.getElementById('code-inp').value;
        if(val.startsWith("UP_")) {
            try {
                let data = JSON.parse(atob(val.replace("UP_", "")));
                if(data.type === "mult") { g.mult = data.val; alert("Event X" + data.val); }
                if(data.type === "promo") {
                    activePromo = data;
                    document.getElementById('promo-container').style.display = "block";
                    document.getElementById('promo-name').innerText = data.name;
                    document.getElementById('promo-btn').innerText = data.cost + " 💎";
                    alert("Магазин обновлен!");
                }
            } catch(e) { alert("Ошибка кода!"); }
        } else { alert("Неверный формат!"); }
        document.getElementById('code-inp').value = ""; ui();
    }

    function buyPromo() {
        if(activePromo && g.gems >= activePromo.cost) {
            g.gems -= activePromo.cost; g.m += activePromo.reward;
            document.getElementById('promo-container').style.display = "none";
            activePromo = null; ui(); alert("Успешно!");
        } else { alert("Недостаточно гемов!"); }
    }

    ui();
</script>
</body>
</html>
