<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energy Cat Tycoon: EVOLUTION 2026</title>
    <style>
        :root { 
            --common: #bdc3c7; --rare: #3498db; --epic: #9b59b6; 
            --mythic: #e67e22; --legendary: #f1c40f; --excl: #e74c3c;
            --bg: #0d0d12; --panel: #1c1c24; 
        }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 70px; user-select: none; }
        
        /* Навигация */
        .tabs { position: fixed; bottom: 0; width: 100%; background: var(--panel); display: flex; justify-content: space-around; padding: 10px 0; border-top: 2px solid #333; z-index: 1000; }
        .tab-btn { background: none; border: none; color: #888; font-size: 12px; cursor: pointer; }
        .tab-btn.active { color: var(--rare); font-weight: bold; }

        /* Экраны */
        .screen { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Статистика */
        .top-bar { background: var(--panel); padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .stat-val { font-weight: bold; color: #ff9f43; }

        /* Бойцы и Магазин */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: var(--panel); border-radius: 15px; padding: 15px; text-align: center; border: 1px solid #333; position: relative; }
        .rarity-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; position: absolute; top: 5px; right: 5px; text-transform: uppercase; }
        
        /* Кнопка Кота */
        .main-cat { font-size: 120px; margin: 40px auto; display: block; cursor: pointer; transition: 0.1s; width: fit-content; }
        .main-cat:active { transform: scale(0.8); }

        /* Пасс и Квесты */
        .pass-bar { background: #333; height: 20px; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .pass-fill { height: 100%; background: linear-gradient(90deg, #f1c40f, #e67e22); width: 0%; transition: 0.5s; }
        
        .box-timer { font-size: 14px; color: #2ecc71; margin-top: 10px; }
        .locked { filter: grayscale(1); opacity: 0.5; }
        
        input[type="password"], input[type="text"] { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #0f0; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>⚡ <span id="en-val" class="stat-val">0</span></div>
        <div>💎 <span id="gem-val" style="color: #a55eea;">0</span></div>
        <div>⭐ <span id="xp-val" style="color: #f1c40f;">0</span></div>
    </div>

    <!-- ЭКРАН 1: КЛИКЕР -->
    <div id="scr-click" class="screen active">
        <div id="boss-zone" style="display:none; background: #4b1a1a; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
            <b id="boss-name">BOSS</b>
            <div style="background:#222; height:10px; border-radius:5px;"><div id="boss-hp" style="height:100%; background:red; width:100%;"></div></div>
        </div>
        <div class="main-cat" id="cat-btn">🐱</div>
        <h3 id="cat-rank">Обычный Котёнок</h3>
        <p id="click-pwr">Сила клика: 1</p>
    </div>

    <!-- ЭКРАН 2: БОЙЦЫ -->
    <div id="scr-fighters" class="screen">
        <h2>Мои Бойцы</h2>
        <div class="grid" id="fighters-list">
            <!-- Бойцы добавляются здесь -->
        </div>
    </div>

    <!-- ЭКРАН 3: МАГАЗИН И БОКСЫ -->
    <div id="scr-shop" class="screen">
        <h2>Магазин Боксов</h2>
        <div class="grid">
            <div class="card">
                <b>Обычный Бокс</b><br><small>10,000 Энергии</small>
                <button onclick="buyBox('energy')" style="width:100%; background:var(--rare); border:none; padding:8px; margin-top:5px; border-radius:5px;">Открыть</button>
            </div>
            <div class="card">
                <div class="rarity-tag" style="background:var(--legendary); color:black;">BEST</div>
                <b>Мега Бокс</b><br><small>250 Гемов</small>
                <button onclick="buyBox('gem')" style="width:100%; background:var(--legendary); border:none; padding:8px; margin-top:5px; border-radius:5px;">Открыть</button>
            </div>
        </div>
        <p class="box-timer" id="free-box-timer">Бесплатный бокс через: --:--</p>
        <hr>
        <div id="promo-area"></div>
    </div>

    <!-- ЭКРАН 4: ПАСС И КВЕСТЫ -->
    <div id="scr-pass" class="screen">
        <h2>Energy Pass</h2>
        <div class="pass-bar"><div class="pass-fill" id="pass-progress"></div></div>
        <p>Уровень: <span id="pass-lvl">1</span></p>
        <div id="quest-list">
            <!-- Квесты -->
        </div>
    </div>

    <!-- ЭКРАН 5: АДМИНКА -->
    <div id="scr-admin" class="screen">
        <input type="password" id="adm-p" placeholder="Пароль доступа">
        <input type="text" id="adm-c" style="display:none" placeholder="Введите код UP_...">
        <button onclick="handleAdmin()" style="width:100%; padding:15px; margin-top:10px; background:#333; color:white; border:none; border-radius:10px;">ВВОД</button>
        <br><br>
        <button onclick="saveToTxt()" style="font-size:10px;">Сохранить в .txt</button>
        <button onclick="document.getElementById('load-f').click()" style="font-size:10px;">Загрузить .txt</button>
        <input type="file" id="load-f" style="display:none" onchange="loadFromTxt(event)">
    </div>

    <div class="tabs">
        <div class="tab-btn active" onclick="showScreen('scr-click', this)">КЛИК</div>
        <div class="tab-btn" onclick="showScreen('scr-fighters', this)">БОЙЦЫ</div>
        <div class="tab-btn" onclick="showScreen('scr-shop', this)">МАГАЗИН</div>
        <div class="tab-btn" onclick="showScreen('scr-pass', this)">ПАСС</div>
        <div class="tab-btn" onclick="showScreen('scr-admin', this)">АДМИН</div>
    </div>

<script>
    // --- ДАННЫЕ ИГРЫ ---
    const RARITY = {
        COMMON: { n: "Обычный", c: "#bdc3c7", price: 100 },
        RARE: { n: "Редкий", c: "#3498db", price: 200 },
        EPIC: { n: "Эпический", c: "#9b59b6", price: 300 },
        MYTHIC: { n: "Мифический", c: "#e67e22", price: 400 },
        LEGEND: { n: "Легенда", c: "#f1c40f", price: 500 },
        EXCL: { n: "ЭКСКЛЮЗИВ", c: "#e74c3c", price: 9999 }
    };

    const ALL_FIGHTERS = [
        { id: 'f1', name: 'Энергия Кот', rarity: 'COMMON', power: 2, icon: '🐱' },
        { id: 'f2', name: 'H2 Кот', rarity: 'RARE', power: 5, icon: '💧' },
        { id: 'f3', name: 'Плащ-Кот', rarity: 'EPIC', power: 12, icon: '🧥' },
        { id: 'f4', name: 'Сильный Энерго-Кот', rarity: 'MYTHIC', power: 30, icon: '💪' },
        { id: 'f5', name: 'Кот-Зевс', rarity: 'LEGEND', power: 100, icon: '⚡' },
        { id: 'f6', name: 'Эксклюзивный Эпик', rarity: 'EXCL', power: 250, icon: '👑' }
    ];

    let g = {
        energy: 0, gems: 0, xp: 0, 
        fighters: ['f1'], 
        passLvl: 1, 
        lastBoxTime: Date.now(),
        mult: 1, 
        isAdmin: false
    };

    // --- ЛОГИКА ---
    function showScreen(id, btn) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function updateUI() {
        document.getElementById('en-val').innerText = Math.floor(g.energy).toLocaleString();
        document.getElementById('gem-val').innerText = g.gems;
        document.getElementById('xp-val').innerText = g.xp;
        document.getElementById('pass-lvl').innerText = g.passLvl;
        document.getElementById('pass-progress').style.width = (g.xp % 100) + '%';
        
        // Рендер бойцов
        const fList = document.getElementById('fighters-list');
        fList.innerHTML = '';
        ALL_FIGHTERS.forEach(f => {
            const owned = g.fighters.includes(f.id);
            fList.innerHTML += `
                <div class="card ${owned ? '' : 'locked'}">
                    <div class="rarity-tag" style="background:${RARITY[f.rarity].c}">${RARITY[f.rarity].n}</div>
                    <div style="font-size:40px">${f.icon}</div>
                    <b>${f.name}</b><br>
                    <small>Урон: ${f.power}</small>
                </div>
            `;
        });

        // Расчет силы клика
        let totalPwr = 1;
        g.fighters.forEach(fid => {
            const f = ALL_FIGHTERS.find(x => x.id === fid);
            if(f) totalPwr += f.power;
        });
        document.getElementById('click-pwr').innerText = `Сила клика: ${totalPwr * g.mult}`;
        
        localStorage.setItem('EnergyCat_Save2026', JSON.stringify(g));
    }

    document.getElementById('cat-btn').onclick = () => {
        let pwr = 1;
        g.fighters.forEach(fid => { pwr += ALL_FIGHTERS.find(x => x.id === fid).power; });
        g.energy += (pwr * g.mult);
        g.xp += 1;
        if(g.xp % 100 === 0) g.passLvl++;
        updateUI();
    };

    // Система Боксов
    function buyBox(type) {
        if(type === 'energy' && g.energy >= 10000) {
            g.energy -= 10000;
            openBox(['COMMON', 'RARE', 'EPIC']);
        } else if(type === 'gem' && g.gems >= 250) {
            g.gems -= 250;
            openBox(['RARE', 'EPIC', 'MYTHIC', 'LEGEND']);
        }
    }

    function openBox(pool) {
        const rand = Math.random();
        let drop = ALL_FIGHTERS[0];
        if(rand > 0.95 && pool.includes('LEGEND')) drop = ALL_FIGHTERS.find(f => f.rarity === 'LEGEND');
        else if(rand > 0.8) drop = ALL_FIGHTERS.find(f => f.rarity === 'MYTHIC') || drop;
        
        if(!g.fighters.includes(drop.id)) {
            g.fighters.push(drop.id);
            alert(`ВЫПАЛ НОВЫЙ БОЕЦ: ${drop.name}!`);
        } else {
            const compensation = 50;
            g.gems += compensation;
            alert(`Повторка! Получено ${compensation} гемов.`);
        }
        updateUI();
    }

    // Админка
    function handleAdmin() {
        const p = document.getElementById('adm-p');
        const c = document.getElementById('adm-c');
        if(!g.isAdmin) {
            if(p.value === "0605" || p.value === "132546578900") {
                g.isAdmin = true; p.style.display='none'; c.style.display='block';
            }
        } else {
            let val = c.value;
            if(val.startsWith('UP_')) {
                let data = JSON.parse(atob(val.replace('UP_','')));
                if(data.type === 'give_all') g.fighters = ALL_FIGHTERS.map(f => f.id);
                if(data.type === 'add_gems') g.gems += data.amt;
                if(data.type === 'set_mult') g.mult = data.amt;
                alert("Код применен!");
            }
            c.value = ''; updateUI();
        }
    }

    // Текстовые сохранения
    function saveToTxt() {
        const blob = new Blob([JSON.stringify(g)], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cat_mega_save.txt';
        a.click();
    }

    function loadFromTxt(e) {
        const r = new FileReader();
        r.onload = (ev) => { g = JSON.parse(ev.target.result); updateUI(); };
        r.readAsText(e.target.files[0]);
    }

    // Инициализация таймера
    setInterval(() => {
        let now = Date.now();
        let diff = 300000 - (now - g.lastBoxTime); // 5 минут
        if(diff <= 0) {
            document.getElementById('free-box-timer').innerText = "Бесплатный бокс ГОТОВ!";
        } else {
            let m = Math.floor(diff/60000);
            let s = Math.floor((diff%60000)/1000);
            document.getElementById('free-box-timer').innerText = `Бесплатный бокс через: ${m}:${s < 10 ? '0'+s : s}`;
        }
    }, 1000);

    if(localStorage.getItem('EnergyCat_Save2026')) g = JSON.parse(localStorage.getItem('EnergyCat_Save2026'));
    updateUI();
</script>
</body>
</html>
