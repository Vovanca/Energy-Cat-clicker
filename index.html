<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energy Cat Tycoon 2026</title>
    <style>
        :root { --orange: #ff9f43; --blue: #54a0ff; --purple: #a55eea; --dark: #0d0d0f; --red: #ff4757; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; touch-action: manipulation; }
        
        #lang-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--dark); z-index:1000; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .btn-l { width:200px; padding:15px; margin:10px; border-radius:12px; background:var(--blue); color:white; border:none; font-size:18px; font-weight:bold; }

        .stats-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid #222; margin-bottom: 10px; }
        #energy { font-size: 42px; color: var(--orange); font-weight: bold; }
        
        #cat { font-size: 100px; cursor: pointer; transition: 0.1s; display: inline-block; margin: 15px 0; user-select: none; }
        #cat:active { transform: scale(0.85); }
        
        .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 400px; margin: auto; }
        .item { background: #1e1e24; padding: 10px; border-radius: 12px; border: 1px solid #333; font-size: 13px; }
        .buy-b { background: var(--blue); color: white; width: 100%; padding: 8px; border-radius: 6px; border: none; font-weight: bold; margin-top: 5px; }
        
        #boss-ui { display: none; padding: 15px; border-radius: 15px; margin: 10px auto; max-width: 350px; }
        .hp-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-top: 5px; overflow: hidden; }
        #hp-f { height: 100%; width: 100%; background: var(--red); transition: 0.2s; }
        .shadow-b { background: #000; border: 2px solid #555; box-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .norm-b { background: #4b1a1a; border: 1px solid var(--red); }

        .promo-card { background: linear-gradient(45deg, #2c3e50, #000); border: 1px solid var(--purple) !important; grid-column: span 2; }
        .admin-sec { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; }
        input { width: 80%; padding: 10px; background: #111; border: 1px solid #333; color: #0f0; border-radius: 8px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div id="lang-screen">
    <h2>Energy Cat 2026</h2>
    <button class="btn-l" onclick="setL('ru')">Русский 🇷🇺</button>
    <button class="btn-l" onclick="setL('en')">English 🇺🇸</button>
</div>

<div class="stats-box">
    <div id="energy">0</div>
    <div id="cat-rank" style="color: #888;">Котёнок</div>
    <div>Гемы: <span id="gems" style="color:var(--purple)">0</span> 💎</div>
    <div style="font-size:12px; opacity:0.6;">Mult: x<span id="mult">1</span></div>
</div>

<div id="boss-ui">
    <div id="b-icon" style="font-size:40px;">🐶</div>
    <b id="b-name">BOSS</b>
    <div class="hp-bar"><div id="hp-f"></div></div>
</div>

<div id="cat">🐱</div>

<div class="shop">
    <div class="item">Power<button class="buy-b" onclick="buy('p')">Cost: <span id="pc">15</span></button></div>
    <div class="item">Auto<button class="buy-b" onclick="buy('a')">Cost: <span id="ac">50</span></button></div>
    
    <div id="promo-box" class="item promo-card" style="display:none">
        <span id="promo-n">Action</span>
        <button class="buy-b" onclick="buyPromo()" id="promo-btn" style="background:var(--purple)">Buy</button>
    </div>
</div>

<div class="admin-sec">
    <input type="password" id="adm-pass" placeholder="Password (0605)">
    <input type="text" id="adm-code" placeholder="Code (100en... / UP_...)" style="display:none">
    <button onclick="handleAdmin()" style="background:#333; color:white; padding:10px; border-radius:8px; border:none; width:84%;">OK</button>
    
    <div style="margin-top:10px;">
        <button onclick="saveGame()" style="width:40%; font-size:10px;">Save .TXT</button>
        <button onclick="document.getElementById('f-in').click()" style="width:40%; font-size:10px;">Load .TXT</button>
        <input type="file" id="f-in" style="display:none" onchange="loadGame(event)">
    </div>
</div>

<script>
    let g = { m: 0, p: 1, a: 0, pc: 15, ac: 50, gems: 0, mult: 1, lang: null, gift: false };
    let boss = { active: false, hp: 0, mHp: 0, type: 'normal' };
    let activePromo = null;
    let auth = false;

    const lang = {
        ru: { r0: "Котёнок", r1: "Сильный Кот 💪", r2: "СУПЕР-КОТ ⚡", win: "Победа!", bossS: "ТЕНЕВОЙ ВРАГ", bossN: "ЗЛОЙ ПЁС" },
        en: { r0: "Kitten", r1: "Strong Cat 💪", r2: "SUPER CAT ⚡", win: "Victory!", bossS: "SHADOW ENEMY", bossN: "EVIL DOG" }
    };

    if(localStorage.getItem('CatEnergy2026_Final')) {
        g = JSON.parse(localStorage.getItem('CatEnergy2026_Final'));
        if(g.lang) document.getElementById('lang-screen').style.display='none';
    }

    function setL(l) { g.lang = l; document.getElementById('lang-screen').style.display='none'; ui(); }

    function ui() {
        if(!g.lang) return;
        document.getElementById('energy').innerText = Math.floor(g.m).toLocaleString();
        document.getElementById('gems').innerText = g.gems;
        document.getElementById('pc').innerText = g.pc;
        document.getElementById('ac').innerText = g.ac;
        document.getElementById('mult').innerText = g.mult;

        let r = document.getElementById('cat-rank');
        let c = document.getElementById('cat');
        if(g.m < 2000) { r.innerText = lang[g.lang].r0; }
        else if(g.m < 10000) { r.innerText = lang[g.lang].r1; c.innerText = '🐯'; }
        else { r.innerText = lang[g.lang].r2; c.innerText = '🦁'; }

        localStorage.setItem('CatEnergy2026_Final', JSON.stringify(g));
    }

    document.getElementById('cat').onclick = () => {
        if(boss.active) {
            boss.hp -= g.p;
            document.getElementById('hp-f').style.width = (boss.hp/boss.mHp)*100 + '%';
            if(boss.hp <= 0) {
                boss.active = false; document.getElementById('boss-ui').style.display='none';
                let rew = boss.type==='shadow' ? 25 : 5; g.gems += rew; alert(lang[g.lang].win + " +" + rew + " 💎");
            }
        } else {
            g.m += (g.p * g.mult);
            if(Math.random() < 0.03) spawnBoss('shadow'); else if(Math.random() < 0.1) spawnBoss('normal');
        }
        ui();
    };

    function spawnBoss(t) {
        boss.active = true; boss.type = t;
        const bUI = document.getElementById('boss-ui');
        bUI.style.display = 'block';
        if(t === 'shadow') { boss.mHp = g.p * 50; bUI.className = 'shadow-b'; document.getElementById('b-icon').innerText="🌑"; document.getElementById('b-name').innerText=lang[g.lang].bossS; }
        else { boss.mHp = g.p * 15; bUI.className = 'norm-b'; document.getElementById('b-icon').innerText="🐶"; document.getElementById('b-name').innerText=lang[g.lang].bossN; }
        boss.hp = boss.mHp;
    }

    setInterval(() => { if(g.a > 0 && !boss.active) { g.m += (g.a * g.mult); ui(); } }, 1000);

    function buy(t) {
        if(t==='p' && g.m>=g.pc) { g.m-=g.pc; g.p++; g.pc=Math.round(g.pc*1.6); }
        if(t==='a' && g.m>=g.ac) { g.m-=g.ac; g.a++; g.ac=Math.round(g.ac*1.7); }
        ui();
    }

    function handleAdmin() {
        let p = document.getElementById('adm-pass');
        let c = document.getElementById('adm-code');
        if(!auth) {
            if(p.value === "0605" || p.value === "132546578900") {
                auth = true; p.style.display='none'; c.style.display='inline-block';
            }
        } else {
            let v = c.value;
            if(v.startsWith('100en')) { g.m += parseInt(v.replace('100en','')) || 0; }
            else if(v.startsWith('UP_')) {
                let d = JSON.parse(atob(v.replace('UP_','')));
                if(d.type==='mult') g.mult = d.val;
                if(d.type==='promo') {
                    activePromo = d;
                    document.getElementById('promo-box').style.display='block';
                    document.getElementById('promo-n').innerText = d.name;
                    document.getElementById('promo-btn').innerText = d.cost + " 💎";
                }
            }
            c.value = ""; ui();
        }
    }

    function buyPromo() {
        if(activePromo && g.gems >= activePromo.cost) {
            g.gems -= activePromo.cost; g.m += activePromo.reward;
            document.getElementById('promo-box').style.display='none';
            activePromo = null; ui();
        }
    }

    function saveGame() {
        const blob = new Blob([JSON.stringify(g)], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cat_save_2026.txt';
        a.click();
    }

    function loadGame(e) {
        const r = new FileReader();
        r.onload = (ev) => { g = JSON.parse(ev.target.result); ui(); alert("OK!"); };
        r.readAsText(e.target.files[0]);
    }
    ui();
</script>
</body>
</html>
