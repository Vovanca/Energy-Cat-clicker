<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Cat 2026: Multilingual</title>
    <style>
        :root { --orange: #ff9f43; --blue: #54a0ff; --purple: #a55eea; --dark: #0d0d0f; --red: #ff4757; }
        body { background: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; overflow-x: hidden; }
        
        /* Экран выбора языка */
        #lang-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--dark); z-index: 100; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
        }
        .lang-btn { 
            width: 200px; padding: 20px; margin: 10px; font-size: 20px; 
            background: var(--blue); border: none; border-radius: 15px; color: white; cursor: pointer;
        }

        .stats { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 20px; border: 1px solid #222; margin-bottom: 10px; }
        #energy { font-size: 45px; color: var(--orange); font-weight: bold; }
        
        #cat { font-size: 110px; cursor: pointer; transition: 0.1s; user-select: none; display: inline-block; margin: 20px 0; }
        #cat:active { transform: scale(0.8); }
        
        #boss-ui { display: none; padding: 20px; border-radius: 15px; margin: 10px auto; max-width: 350px; }
        .boss-hp-bar { width: 100%; height: 12px; background: #333; border-radius: 6px; margin-top: 10px; overflow: hidden; }
        #hp-fill { height: 100%; width: 100%; background: var(--red); transition: 0.2s; }
        
        .shadow-boss { background: #000 !important; border: 2px solid #555 !important; box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .normal-boss { background: #4b1a1a; border: 1px solid var(--red); }

        .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px auto; max-width: 400px; }
        .item { background: #1e1e24; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-buy { background: var(--blue); color: white; }
        .btn-gift { background: #2ecc71; color: white; margin-bottom: 15px; }
        
        input { background: #1a1a1a; border: 1px solid #333; color: #0f0; padding: 12px; border-radius: 8px; width: 80%; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Выбор языка -->
    <div id="lang-screen">
        <h2 id="lang-title">Выберите язык / Select Language</h2>
        <button class="lang-btn" onclick="setLang('ru')">Русский 🇷🇺</button>
        <button class="lang-btn" onclick="setLang('en')">English 🇺🇸</button>
    </div>

    <div class="stats">
        <div id="energy">0</div>
        <div><span id="txt-gems">Гемы</span>: <span id="gems" style="color:var(--purple)">0</span> 💎</div>
        <div style="font-size: 13px; color: #777; margin-top: 5px;"><span id="txt-mult">Множитель</span>: <span id="event-mult">x1</span></div>
    </div>

    <button id="newbie-gift" class="btn-gift" onclick="getGift()">🎁 ПОДАРОК: +1000 EN</button>

    <div id="boss-ui">
        <div id="boss-icon" style="font-size: 50px;">👹</div>
        <b id="boss-name">БОСС</b>
        <div class="boss-hp-bar"><div id="hp-fill"></div></div>
        <small id="boss-hp-text">100/100</small>
    </div>

    <div id="cat">🐱</div>

    <div class="shop">
        <div class="item"><span id="txt-pwr">Сила клика</span><button class="btn-buy" onclick="buy('p')"><span id="txt-price1">Цена</span>: <span id="p-c">15</span></button></div>
        <div class="item"><span id="txt-promo">Акция</span><button class="btn-buy" id="promo-gem-btn" onclick="buyPromo()" disabled>...</button></div>
    </div>

    <input type="text" id="admin-code" placeholder="Код / Code">
    <button onclick="applyAdminCode()" style="width:84%; margin-top:8px; background:#333; color:white;" id="txt-apply">Применить</button>

<script>
    // Текстовые данные
    const langData = {
        ru: {
            gems: "Гемы", mult: "Событие", gift: "🎁 ПОДАРОК: +1000 EN",
            pwr: "Сила клика", promo: "Акция Гемов", price: "Цена",
            apply: "Применить", bossNormal: "ЗЛОЙ ПЁС", bossShadow: "ТЕНЕВОЙ ВРАГ",
            win: "ПОБЕДА! Получено", alertPromo: "Акция добавлена!", alertGift: "Вы получили 1000 EN!"
        },
        en: {
            gems: "Gems", mult: "Event", gift: "🎁 GIFT: +1000 EN",
            pwr: "Click Power", promo: "Gem Promo", price: "Price",
            apply: "Apply Code", bossNormal: "EVIL DOG", bossShadow: "SHADOW ENEMY",
            win: "VICTORY! Received", alertPromo: "Promo added!", alertGift: "You got 1000 EN!"
        }
    };

    let g = { m: 0, p: 1, pc: 15, gems: 0, mult: 1, giftUsed: false, lang: null };
    let boss = { active: false, hp: 0, maxHp: 0, type: 'normal' };

    // Загрузка
    if(localStorage.getItem('catEnergy_v4')) {
        g = JSON.parse(localStorage.getItem('catEnergy_v4'));
        if(g.lang) document.getElementById('lang-screen').style.display = 'none';
    }

    function setLang(l) {
        g.lang = l;
        document.getElementById('lang-screen').style.display = 'none';
        ui();
    }

    function ui() {
        if(!g.lang) return;
        const t = langData[g.lang];
        
        document.getElementById('energy').innerText = Math.floor(g.m).toLocaleString();
        document.getElementById('gems').innerText = g.gems;
        document.getElementById('p-c').innerText = g.pc;
        document.getElementById('event-mult').innerText = 'x' + g.mult;
        
        // Тексты
        document.getElementById('txt-gems').innerText = t.gems;
        document.getElementById('txt-mult').innerText = t.mult;
        document.getElementById('newbie-gift').innerText = t.gift;
        document.getElementById('txt-pwr').innerText = t.pwr;
        document.getElementById('txt-price1').innerText = t.price;
        document.getElementById('txt-promo').innerText = t.promo;
        document.getElementById('txt-apply').innerText = t.apply;

        document.getElementById('newbie-gift').style.display = g.giftUsed ? 'none' : 'inline-block';
        localStorage.setItem('catEnergy_v4', JSON.stringify(g));
    }

    document.getElementById('cat').onclick = () => {
        if(boss.active) {
            boss.hp -= g.p;
            updateBossUI();
            if(boss.hp <= 0) winBoss();
        } else {
            g.m += (g.p * g.mult);
            let r = Math.random();
            if(r < 0.03) startBoss('shadow');
            else if(r < 0.10) startBoss('normal');
        }
        ui();
    };

    function startBoss(type) {
        boss.active = true;
        boss.type = type;
        const uiDiv = document.getElementById('boss-ui');
        const t = langData[g.lang];
        
        if(type === 'shadow') {
            boss.maxHp = g.p * 45; 
            document.getElementById('boss-name').innerText = t.bossShadow;
            document.getElementById('boss-icon').innerText = "🌑";
            uiDiv.className = 'shadow-boss';
        } else {
            boss.maxHp = g.p * 15;
            document.getElementById('boss-name').innerText = t.bossNormal;
            document.getElementById('boss-icon').innerText = "🐶";
            uiDiv.className = 'normal-boss';
        }
        
        boss.hp = boss.maxHp;
        uiDiv.style.display = 'block';
        updateBossUI();
    }

    function updateBossUI() {
        let pct = (boss.hp / boss.maxHp) * 100;
        document.getElementById('hp-fill').style.width = pct + '%';
        document.getElementById('boss-hp-text').innerText = `${Math.ceil(boss.hp)} / ${boss.maxHp}`;
    }

    function winBoss() {
        boss.active = false;
        document.getElementById('boss-ui').style.display = 'none';
        let reward = (boss.type === 'shadow') ? 25 : 5;
        g.gems += reward;
        alert(`${langData[g.lang].win} ${reward} ${langData[g.lang].gems} 💎`);
        ui();
    }

    function getGift() {
        if(!g.giftUsed) { 
            g.m += 1000; g.giftUsed = true; 
            alert(langData[g.lang].alertGift);
            ui(); 
        }
    }

    function buy(type) {
        if(type === 'p' && g.m >= g.pc) { g.m -= g.pc; g.p += 1; g.pc = Math.round(g.pc * 1.6); ui(); }
    }

    function applyAdminCode() {
        let code = document.getElementById('admin-code').value;
        if(code.startsWith('SET_MULT_')) {
            g.mult = parseInt(code.replace('SET_MULT_', ''));
            alert("OK! x" + g.mult);
        } else if(code.startsWith('PROMO_GEM_')) {
             document.getElementById('promo-gem-btn').disabled = false;
             window.promoAmount = parseInt(code.replace('PROMO_GEM_', ''));
             document.getElementById('promo-gem-btn').innerText = (g.lang === 'ru' ? "Купить" : "Buy");
             alert(langData[g.lang].alertPromo);
        }
        document.getElementById('admin-code').value = ""; ui();
    }

    function buyPromo() {
        if(g.gems >= 10) { g.gems -= 10; g.m += window.promoAmount; ui(); }
    }

    if(g.lang) ui();
</script>
</body>
</html>
