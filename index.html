<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Energy Cat 2026: Total Collection</title>
    <style>
        :root { 
            --common: #bdc3c7; --rare: #3498db; --epic: #9b59b6; 
            --mythic: #e67e22; --legendary: #f1c40f; --plus: #00ffcc;
            --excl: #ff4757; --bg: #0a0a0e; --panel: #16161e; 
        }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; user-select: none; }
        
        .top-bar { background: var(--panel); padding: 15px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333; }
        .stat { font-weight: bold; font-size: 18px; }

        /* Вкладки */
        .tabs { position: fixed; bottom: 0; width: 100%; background: var(--panel); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 1000; }
        .tab-btn { background: none; border: none; color: #555; font-size: 10px; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { color: var(--plus); border-bottom: 2px solid var(--plus); }

        .screen { display: none; padding: 20px; height: 85vh; overflow-y: auto; box-sizing: border-box; }
        .screen.active { display: block; }

        /* Кот и Квесты */
        #cat-main { font-size: 110px; cursor: pointer; transition: 0.1s; display: block; margin: 20px auto; width: fit-content; }
        #cat-main:active { transform: scale(0.85); }
        .quest-card { background: #1c1c24; padding: 15px; border-radius: 12px; border-left: 4px solid var(--plus); margin-top: 20px; }

        /* Сетка Бойцов */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .f-card { background: #1c1c24; padding: 15px; border-radius: 15px; text-align: center; border: 2px solid #333; position: relative; transition: 0.3s; }
        .f-card.locked { opacity: 0.4; filter: grayscale(1); border: 1px dashed #444; }
        .f-rarity { font-size: 8px; font-weight: bold; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 5px; }

        /* Открытие бокса */
        #box-scene { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:3000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        #box-render { font-size:120px; cursor:pointer; }
        #reward-pop { display:none; text-align:center; background:rgba(255,255,255,0.05); padding:30px; border-radius:20px; border:2px solid var(--plus); }

        input { width: 100%; padding: 15px; background: #000; border: 1px solid #444; color: #0f0; border-radius: 10px; margin-bottom: 10px; }
        button { padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <!-- СЦЕНА БОКСА -->
    <div id="box-scene">
        <div id="box-render" onclick="tapBox()">📦</div>
        <div id="reward-pop">
            <div id="rew-icon" style="font-size:80px;">⭐</div>
            <h2 id="rew-name">Награда</h2>
            <button onclick="nextItem()" style="background:var(--plus); color:black;">ДАЛЕЕ</button>
        </div>
        <div id="box-info" style="margin-top:20px; color:var(--plus);">КЛИКАЙ!</div>
    </div>

    <div class="top-bar">
        <div class="stat" style="color:var(--orange)">⚡ <span id="en-val">0</span></div>
        <div class="stat" style="color:var(--purple)">💎 <span id="gem-val">0</span></div>
    </div>

    <!-- КЛИКЕР -->
    <div id="scr-click" class="screen active">
        <div id="cat-main">🐱</div>
        <h2 id="cat-rank">Обычный Котёнок</h2>
        
        <div class="quest-card">
            <b style="color:var(--plus)">ТЕКУЩИЙ КВЕСТ</b><br>
            <span id="q-text">Нажми 100 раз</span>: <span id="q-prog">0</span>/<span id="q-targ">100</span>
            <div style="font-size:10px; color:#666; margin-top:5px;">Награда: +250 XP Энергия Пасса</div>
        </div>
    </div>

    <!-- БОЙЦЫ -->
    <div id="scr-fighters" class="screen">
        <h3>КОЛЛЕКЦИЯ (<span id="f-count">0</span>/10)</h3>
        <div class="grid" id="f-grid"></div>
    </div>

    <!-- КОДЫ -->
    <div id="scr-codes" class="screen">
        <h3>ВВОД ПРОМОКОДА</h3>
        <input type="text" id="promo-input" placeholder="Введите UP_ код">
        <button onclick="usePromo()" style="background:var(--plus); color:black;">АКТИВИРОВАТЬ</button>
        
        <div style="margin-top:40px; border-top:1px solid #333; padding-top:20px;">
            <button onclick="saveGame()" style="background:#222; color:#555; font-size:10px;">💾 Сохранить .txt</button>
            <button onclick="document.getElementById('load-f').click()" style="background:#222; color:#555; font-size:10px; margin-top:5px;">📂 Загрузить .txt</button>
            <input type="file" id="load-f" style="display:none" onchange="loadGame(event)">
        </div>
    </div>

    <div class="tabs">
        <div class="tab-btn active" onclick="tab('scr-click', this)">Клик</div>
        <div class="tab-btn" onclick="tab('scr-fighters', this)">Бойцы</div>
        <div class="tab-btn" onclick="tab('scr-codes', this)">Коды</div>
    </div>

<script>
    const DB = {
        f1: { n: "Кот-Новичок", p: 1, i: "🐱", r: "common" },
        f2: { n: "H2 Энерджи", p: 5, i: "💧", r: "rare" },
        f3: { n: "Плащ-Кот", p: 15, i: "🧥", r: "epic" },
        f4: { n: "Сильный Кот", p: 40, i: "💪", r: "mythic" },
        f5: { n: "Зевс", p: 150, i: "🔱", r: "legendary" },
        f6: { n: "Теневой Бог", p: 500, i: "🌑", r: "excl" }
    };

    let g = { en: 0, gem: 0, xp: 0, owned: ['f1'], mult: 1, q: { c: 0, t: 100 } };

    if(localStorage.getItem('Cat2026_V10')) g = JSON.parse(localStorage.getItem('Cat2026_V10'));

    function tab(id, b) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        b.classList.add('active');
    }

    function ui() {
        document.getElementById('en-val').innerText = Math.floor(g.en).toLocaleString();
        document.getElementById('gem-val').innerText = g.gem;
        document.getElementById('q-prog').innerText = g.q.c;
        document.getElementById('q-targ').innerText = g.q.t;
        
        renderFighters();
        localStorage.setItem('Cat2026_V10', JSON.stringify(g));
    }

    document.getElementById('cat-main').onclick = () => {
        let pwr = 0; g.owned.forEach(id => pwr += DB[id].p);
        g.en += (pwr * g.mult);
        g.q.c++;
        
        if(g.q.c >= g.q.t) {
            g.xp += 250; g.q.c = 0; g.q.t = Math.round(g.q.t * 1.5);
            alert("Квест выполнен! +250 XP");
        }
        ui();
    };

    function renderFighters() {
        const grid = document.getElementById('f-grid');
        grid.innerHTML = '';
        Object.keys(DB).forEach(id => {
            const f = DB[id];
            const own = g.owned.includes(id);
            grid.innerHTML += `
                <div class="f-card ${own ? '' : 'locked'}" style="border-color:var(--${f.r})">
                    <span class="f-rarity" style="background:var(--${f.r}); color:${f.r==='legendary'?'black':'white'}">${f.r}</span>
                    <div style="font-size:35px">${own ? f.i : '❓'}</div>
                    <b>${own ? f.n : '???'}</b>
                </div>
            `;
        });
        document.getElementById('f-count').innerText = g.owned.length;
    }

    function usePromo() {
        let val = document.getElementById('promo-input').value;
        if(val.startsWith('UP_')) {
            try {
                let d = JSON.parse(atob(val.replace('UP_','')));
                if(d.type === 'add_en') g.en += d.amt;
                if(d.type === 'add_gem') g.gem += d.amt;
                if(d.type === 'set_mult') g.mult = d.amt;
                alert("ПРОМОКОД ПРИНЯТ!");
            } catch(e) { alert("ОШИБКА!"); }
        }
        document.getElementById('promo-input').value = ''; ui();
    }

    // --- Система Боксов ---
    let items = 0, taps = 0;
    function tapBox() {
        taps++;
        document.getElementById('box-info').innerText = "КЛИКАЙ! (" + (3-taps) + ")";
        if(taps >= 3) {
            document.getElementById('box-render').style.display = 'none';
            nextItem();
        }
    }

    function nextItem() {
        if(items <= 0) { document.getElementById('box-scene').style.display='none'; return; }
        items--;
        document.getElementById('reward-pop').style.display='block';
        // Логика награды... (как в прошлых кодах)
    }

    function saveGame() {
        const blob = new Blob([JSON.stringify(g)], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cat_save_2026.txt';
        a.click();
    }

    function loadGame(e) {
        const r = new FileReader();
        r.onload = (ev) => { g = JSON.parse(ev.target.result); ui(); };
        r.readAsText(e.target.files);
    }

    ui();
</script>
</body>
</html>
